name: testler
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "mcp==2.3.0" httpx "pydantic>=2.12" fastapi uvicorn python-multipart pytest anyio
      - run: python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8
